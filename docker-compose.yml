services:
  db:
    image: postgres:17-alpine
    container_name: erp-db
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      # 5433 na sua máquina para não brigar com outros Postgres que você já usa
      - "5433:5432"
    volumes:
      - erp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: erp-backend
    env_file: ./backend/.env
    environment:
      # Necessário no Windows para o --reload detectar mudanças nos arquivos
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  erp-db-data:
